name: driver_app
description: AVUXO Motorista App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
 
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  dio: ^5.6.0
  file_picker: ^8.0.0+1
  flutter_polyline_points: ^2.1.0
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  socket_io_client: ^3.1.2
  audioplayers: ^6.5.1

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_image_compress: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/avuxo_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/avuxo_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/